# grok-build 引擎构建清单（#126 B1：lock 升级为 build manifest）
#
# wancode 不把引擎做成 git submodule —— 引擎必须放在仓库的【兄弟目录】
# ../grok-build：src-tauri/Cargo.toml 通过 workspace = "../../grok-build"
# 挂进引擎的 workspace（这样才能吃 `workspace = true` 依赖继承），
# submodule 嵌进来会让两个 .git 互相打架。
#
# 有效树 = fork@commit + wiring patch (+ emergency patch 若非空) + Cargo.lock 覆盖。
# scripts/bootstrap.ps1 按本清单产树；scripts/audit_effective_tree.ps1 verify
# 模式校验全部哈希（CI 每轮执行）。升级引擎 = 改 commit + 重跑 bootstrap + 全量 smoke。
#
# 字段语义：
#   wiring_patch_sha256    vendor/grok-build-wiring.patch 完整文件 sha256。
#                          终态（#126 B4 起）：仅 workspace member 注入
#                          （本机目录结构，永不进 fork），12 行。
#   emergency_patch_sha256 none ⇔ vendor/grok-build-emergency.patch 为 0 字节；
#                          启用时 = 完整文件 sha256（头部两项元数据：事故编号、到期版本）。
#   cargo_lock_sha256      vendor/grok-build-Cargo.lock 完整文件 sha256。
#   effective_tree_sha256  有效树规范化清单摘要（排除 .git/、target/；
#                          相对路径+文件字节哈希 → 排序清单 → 整体 sha256），
#                          由 audit_effective_tree.ps1 hash 模式复算。
repo=https://github.com/ThomasWan123/grok-build.git
