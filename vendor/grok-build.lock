# grok-build 引擎构建清单（#126 B1：lock 升级为 build manifest）
#
# wancode 不把引擎做成 git submodule —— 引擎必须放在仓库的【兄弟目录】
# ../grok-build：src-tauri/Cargo.toml 通过 workspace = "../../grok-build"
# 挂进引擎的 workspace（这样才能吃 `workspace = true` 依赖继承），
# submodule 嵌进来会让两个 .git 互相打架。
#
# 有效树 = fork@commit + wiring patch (+ emergency patch 若非空) + Cargo.lock 覆盖。
# scripts/bootstrap.ps1 按本清单产树；scripts/audit_effective_tree.ps1 verify
# 模式校验全部哈希（CI 每轮执行）。升级引擎 = 改 commit + 重跑 bootstrap + 全量 smoke。
#
# 字段语义：
#   wiring_patch_sha256    vendor/grok-build-wiring.patch 完整文件 sha256。
#                          终态（#126 B4 起）：仅 workspace member 注入
#                          （本机目录结构，永不进 fork），12 行。
#   emergency_patch_sha256 none ⇔ vendor/grok-build-emergency.patch 为 0 字节；
#                          启用时 = 完整文件 sha256（头部两项元数据：事故编号、到期版本）。
#   cargo_lock_sha256      vendor/grok-build-Cargo.lock 完整文件 sha256。
#   effective_tree_sha256  有效树规范化清单摘要（排除 .git/、target/；
#                          相对路径+文件字节哈希 → 排序清单 → 整体 sha256），
#                          由 audit_effective_tree.ps1 hash 模式复算。
#
# 【G26 例外 · v0.19 §1.3】local_extensions_disabled 安全接口
#   批准依据：docs/design/v0.19-layered-surfaces.md §1.3
#   实证：docs/evidence/v019-2c-fanout-probe.log（fan-out 污染六阶段）
#   本批为有意行为变化：effective_tree_sha256 与 commit 变更，等价审计
#   不适用，改由 intentional-delta 模式验证（见接口草案 §10）。
repo=https://github.com/ThomasWan123/grok-build.git
commit=9e9adb62d3251c5cdafbbfe4dcc17ea83b411910
migration_audit_mode=version-only
declared_added_wancode_dependencies=semver
#
# 【dependency-delta · v0.20 W3】新增解析依赖
#   引擎 commit **不动**（2f480062e），有效树里**只有 Cargo.lock 变**，
#   变的方式**只是新增 package**——既有 package 一个没少、没降版。
#   三种既有模式都表达不了这件事（equivalent 要求逐字节相等；version-only
#   的 V3 只许 wancode 版本行不同；intentional-delta 的 A1/A4 要求
#   「commit 变、lock 不变」，与此处恰好相反），故新增本模式，见
#   scripts/migration_audit.ps1 的 D1–D7。
#
# declared_added_packages：**申报制**。多出来的 10 个 package 必须与本行
# 逐字相等（D4），否则审计失败——目的是让「多出来什么」成为评审对象，
# 而不是埋在 118 行 lock diff 里。其中直接依赖 3 个：
#   zip、quick-xml（DOCX）、pdfium-render（PDF）；
#   第 4 个直接依赖 unicode-normalization 已在树内，故不出现在新增里。
# 其余 7 个为上述的传递依赖。D5 另行强制：**不得新增 *-sys**——W1 的教训
# （原生链会把构建复杂度和供应链面一起放大），此前只是注释，现在是机器检查。
declared_added_packages=console_error_panic_hook 0.1.7,console_log 1.1.0,maybe-owned 0.3.4,pdfium-render 0.9.3,piston-float 1.0.1,quick-xml 0.37.5,utf16string 0.2.0,vecmath 1.0.0,zip 2.4.2,zopfli 0.8.3
wiring_patch_sha256=9c671c0ae43f2e21ab90ff7b0fbb55d9ae0d4138e7ae747be4ec6b22f89da708
emergency_patch_sha256=none
cargo_lock_sha256=c48ee7f3c90193855695d6691e502811365847dae05e0c7ce452bbaa75cdce5b
effective_tree_sha256=cf9b6b3548d9b1e4a561ed6cb34a0ef4ba83451d22bd2f55d483213165983c44

# 【harness-kernel delta · v0.21 W3】真实工具执行调度
#   引擎 commit 变、Cargo.lock/接线/紧急补丁均不变；差异仅为
#   acp_session_impl/tool_calls.rs。只读调用最多四路滚动并发；任何非只读
#   调用是全局屏障，必须等待此前调用结束，且后续调用不得越过。
#   白名单：docs/design/v0.19-engine-file-whitelist.txt（历史文件名，现作为
#   intentional-delta 的累积机器白名单；v0.21 条目在文件末尾单列）。
#
# 【历史】上面的 declared_added_packages（W3 dependency-delta）与
# declared_added_wancode_dependencies（#67 wancode-lock-delta）属于此前两轮，
# 当前模式不读它们；保留是为了留档「那两轮各申报了什么」。
#
# 【security-upgrade-delta · v0.20 复核 P1】依赖安全升级
#   引擎 commit **不动**（2f480062e），有效树里**只有 Cargo.lock 变**，变的方式
#   是**升级既有包**——这正好撞在 dependency-delta 的 D3「既有 package 一个没少、
#   没改版」上，故新增第六种模式，见 scripts/migration_audit.ps1 的 S1–S10。
#
# declared_security_upgrades：**申报制**，每条三段『包名 旧版->新版 编号』。
#   编号是 RUSTSEC 号（一次修多条用 + 连接）或 collateral——collateral 指
#   cargo 解析器为满足安全升级顺带抬上来、本身不修任何公告的包。不许拿一个
#   RUSTSEC 号给一整批背书，S6 会逐条校验。
#   本轮真正关掉的公告：0204(crossbeam-epoch)、0258(h2)、0257(webbrowser)、
#   0194+0195 的 wancode 直接依赖链路(quick-xml 0.37.5->0.41.0)。
#   plist / pdf_oxide / taffy 是升级过程中被一同抬起的，标 collateral；其中
#   pdf_oxide 0.3.74 顺带把 quick-xml 0.39.4 挤出了 Windows 解析。
#   quick-xml 升 0.41 是**破坏性 API 变更**（GeneralRef 事件拆分、
#   BytesText::unescape 移除），产品侧适配与回归见 src-tauri/src/work_docx.rs ⑥。
declared_security_upgrades=crossbeam-epoch 0.9.18->0.9.20 RUSTSEC-2026-0204,h2 0.4.15->0.4.17 RUSTSEC-2026-0258,webbrowser 1.0.6->1.2.4 RUSTSEC-2026-0257,quick-xml 0.37.5->0.41.0 RUSTSEC-2026-0194+RUSTSEC-2026-0195,plist 1.8.0->1.10.0 collateral,pdf_oxide 0.3.46->0.3.74 collateral,taffy 0.10.1->0.12.2 collateral
#
# declared_upgrade_additions：上述升级带进来的新 package（含既有包名多出的新
#   版本）。S7 另行强制：不得新增 *-sys **包名**（既有 -sys 包多一个版本不算，
#   jni-sys 0.4.1 就是这种情况——webbrowser 1.2.4 的 Android 目标链，
#   不进 Windows 二进制）。
declared_upgrade_additions=atoi_simd 0.18.1,debug_unsafe 0.1.4,fast-float2 0.2.4,hayro-jpeg2000 0.4.0,jni 0.22.4,jni-macros 0.22.4,jni-sys 0.4.1,jni-sys-macros 0.4.1,office_oxide 0.1.8,phf 0.14.0,phf_generator 0.14.0,phf_macros 0.14.0,phf_shared 0.14.0,simd_cesu8 1.2.0,typed-path 0.12.3,weezl 0.2.1,zip 8.6.0
