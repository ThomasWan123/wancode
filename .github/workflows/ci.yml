# 降级 CI（v0.13-4，docs/improvement-plan.md 差异一）：
# 每次 push/PR 只跑轻量三件套——前端 tsc+build、三处版本号一致性、
# Rust clippy + lib 单测 + 引擎金丝雀。全量 tauri build（装包/签名）
# 不进 CI：需要 updater 私钥且耗时，发布仍走本机 scripts/release.ps1。
#
# Rust job 的引擎来源 = vendor/grok-build.lock 固定 commit + 本地补丁，
# 与 scripts/bootstrap.ps1 同一套流程（这里内联精简版，跳过 npm/工具检查）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # 阻塞载荷的解析必须 fail-closed：读不懂 ≠ 没有阻塞。
      - run: npm test
      - run: npm run build

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 五处版本号必须一致：package.json / tauri.conf.json / Cargo.toml，
      # 外加 package-lock.json 的顶部 version 与 packages[""].version——
      # v0.18.9 时 lockfile 曾漂移在 0.18.6，此前三处检查全绿照样放行
      # （PR #16 复盘）。lockfile 不一致时任何一次 npm install 都会把它
      # 自动同步并产生工作树噪音。
      - run: |
          set -e
          a=$(node -p "require('./package.json').version")
          b=$(node -p "require('./src-tauri/tauri.conf.json').version")
          c=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          d=$(node -p "require('./package-lock.json').version")
          e=$(node -p "require('./package-lock.json').packages[''].version")
          echo "package.json=$a tauri.conf.json=$b Cargo.toml=$c lock.version=$d lock.root=$e"
          [ "$a" = "$b" ] && [ "$b" = "$c" ] || { echo "::error::版本号不一致（manifest 三处）"; exit 1; }
          [ "$a" = "$d" ] && [ "$a" = "$e" ] || { echo "::error::package-lock.json 版本漂移（$d/$e ≠ $a），运行 npm install 同步后提交"; exit 1; }

  rust:
    runs-on: windows-latest
    env:
      # 与本机构建一致：lld-link 绕 MSVC PDB 上限 + 扩栈（见 release.ps1 头注）
      RUSTFLAGS: "-C link-arg=/STACK:16777216"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
    steps:
      - uses: actions/checkout@v4
      # bootstrap 的工具链检查要求 protoc 先就位，故 setup-protoc 前置。
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # #126 B1：与 bootstrap 同一代码路径产树（-Dest 指到兄弟目录 = 缺省布局），
      # 不再内联复制克隆/打补丁逻辑。
      - name: 按构建清单产引擎有效树（bootstrap -Dest）
        shell: pwsh
        run: |
          $engine = Join-Path (Split-Path $PWD -Parent) "grok-build"
          powershell -File scripts/bootstrap.ps1 -Dest $engine
      # #126 B1 CI 三道断言（设计稿 §4）：HEAD==lock.commit；wiring/emergency/
      # cargo_lock 三文件哈希==清单（emergency none ⇔ 0 字节，非空则事故编号/
      # 到期版本齐备且未到期）；porcelain 精确集合 + effective_tree_sha256 复算。
      - name: 构建清单校验（audit_effective_tree verify）
        shell: pwsh
        run: |
          $engine = Join-Path (Split-Path $PWD -Parent) "grok-build"
          powershell -File scripts/audit_effective_tree.ps1 verify -Engine $engine
      - name: 占位 dist（tauri generate_context! 编译期要求 frontendDist 存在）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content dist/index.html "<!doctype html><title>ci stub</title>"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "../grok-build -> target"
      - name: clippy
        working-directory: src-tauri
        # --no-deps：-D warnings 只对 wancode 自身生效。引擎是固定 commit 的
        # 上游代码，自带若干 clippy 警告，不该由我们的 CI 拦截。
        run: cargo clippy --locked -p wancode --lib --no-deps -- -D warnings
      # Gate 1：证明"选中某模型"的请求确实落在该模型自己的端点上、带自己的
      # Key。断言是请求计数（正确端点 1 次、错误端点 0 次）与 Authorization
      # 头，不是对代码路径的推理。跑在引擎目录，与克隆步同一套路径推导。
      - name: Gate 1 引擎侧路由证据（双 mock 端点）
        shell: pwsh
        run: |
          $engine = Join-Path (Split-Path $PWD -Parent) "grok-build"
          Set-Location $engine
          cargo test --locked -p xai-grok-shell --test model_endpoint_routing
      # #127-4 D3 落点：上下文压缩由引擎 crate 单测覆盖（合规矩阵引用此步）。
      - name: 引擎压缩单测（xai-grok-compaction）
        shell: pwsh
        run: |
          $engine = Join-Path (Split-Path $PWD -Parent) "grok-build"
          Set-Location $engine
          cargo test --locked -p xai-grok-compaction
      # 磁盘上的旧会话记录 → 歧义 → 用户选定 → 真实 HTTP。不含 GUI 那一段。
      - name: 引擎身份链集成测试（旧记录 → 歧义 → 选定 → 正确端点）
        shell: pwsh
        run: |
          $engine = Join-Path (Split-Path $PWD -Parent) "grok-build"
          Set-Location $engine
          cargo test --locked -p xai-grok-shell --test model_identity_e2e
      - name: lib 单测 + 引擎金丝雀
        working-directory: src-tauri
        env:
          COMPLIANCE_SUMMARY_PATH: ${{ github.workspace }}/compliance-summary-4a.json
          COMPLIANCE_SUMMARY_PATH_4B: ${{ github.workspace }}/compliance-summary-4b.json
        run: cargo test --locked -p wancode --lib --test engine_canary --test model_block_over_acp --test job_breakaway --test provider_compliance --test provider_compliance_4b
      # v0.19 2c：同一引擎连接内，Code 全局重载插件后，Chat 仍须保持
      # registry/hook 为空，且 provider 请求只能携带 web_search/web_fetch。
      - name: Chat 本地扩展 fan-out 回归
        working-directory: src-tauri
        shell: pwsh
        run: |
          $env:WANCODE_PLUGIN_FANOUT_PROBE = "1"
          try {
            cargo test --locked -p wancode --lib -- --ignored plugin_fanout_cannot_pollute_extensions_disabled_chat --nocapture --test-threads=1
          } finally {
            Remove-Item Env:\WANCODE_PLUGIN_FANOUT_PROBE -ErrorAction SilentlyContinue
          }
      # Cargo.lock 漂移防线第二层（第一层是上面所有 cargo 命令的 --locked）：
      # 全套 Rust 测试后断言引擎工作树的 Cargo.lock 与 vendor 覆盖文件逐字节
      # 一致。--locked 只保证语义等价，这里保证连格式重写都没发生。
      # B1（#14）合入后此步可升级为 scripts/audit_effective_tree.ps1 verify。
      - name: 引擎 Cargo.lock 未漂移校验
        shell: pwsh
        run: |
          $engine = Join-Path (Split-Path $PWD -Parent) "grok-build"
          $a = (Get-FileHash (Join-Path $engine "Cargo.lock") -Algorithm SHA256).Hash
          $b = (Get-FileHash "vendor/grok-build-Cargo.lock" -Algorithm SHA256).Hash
          if ($a -ne $b) {
            Write-Host "::error::引擎 Cargo.lock 在构建/测试后被 Cargo 改写，与 vendor/grok-build-Cargo.lock 不一致。请在干净有效树上重新生成覆盖文件并提交。"
            exit 1
          }
          Write-Host "引擎 Cargo.lock == vendor 覆盖文件（sha256 $a）"
      # #127-4 摘要真实导出：PR 5 从此 artifact 消费，不靠被 cargo 捕获的 stdout。
      - name: 上传合规摘要 artifact
        uses: actions/upload-artifact@v4
        with:
          name: compliance-summary-4a
          path: compliance-summary-4a.json
          if-no-files-found: error
      # #127-5：校验已提交的证据文件（哈希/pass/ci_sha/字段齐备），
      # 不下载即将过期的 artifact。
      - name: 校验合规证据文件
        shell: pwsh
        run: python scripts/verify_compliance_evidence.py
      - name: 上传合规摘要 artifact（4b）
        uses: actions/upload-artifact@v4
        with:
          name: compliance-summary-4b
          path: compliance-summary-4b.json
          if-no-files-found: error
