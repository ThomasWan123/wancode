# 降级 CI（v0.13-4，docs/improvement-plan.md 差异一）：
# 每次 push/PR 只跑轻量三件套——前端 tsc+build、三处版本号一致性、
# Rust clippy + lib 单测 + 引擎金丝雀。全量 tauri build（装包/签名）
# 不进 CI：需要 updater 私钥且耗时，发布仍走本机 scripts/release.ps1。
#
# Rust job 的引擎来源 = vendor/grok-build.lock 固定 commit + 本地补丁，
# 与 scripts/bootstrap.ps1 同一套流程（这里内联精简版，跳过 npm/工具检查）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # 阻塞载荷的解析必须 fail-closed：读不懂 ≠ 没有阻塞。
      - run: npm test
      - run: npm run build

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 三处版本号（package.json / tauri.conf.json / Cargo.toml）必须一致，
      # 否则 updater 的 latest.json 与安装包版本对不上。
      - run: |
          set -e
          a=$(node -p "require('./package.json').version")
          b=$(node -p "require('./src-tauri/tauri.conf.json').version")
          c=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "package.json=$a tauri.conf.json=$b Cargo.toml=$c"
          [ "$a" = "$b" ] && [ "$b" = "$c" ] || { echo "::error::版本号不一致"; exit 1; }

  rust:
    runs-on: windows-latest
    env:
      # 与本机构建一致：lld-link 绕 MSVC PDB 上限 + 扩栈（见 release.ps1 头注）
      RUSTFLAGS: "-C link-arg=/STACK:16777216"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
    steps:
      - uses: actions/checkout@v4
      - name: 按 lock 克隆引擎到兄弟目录并打补丁
        shell: pwsh
        run: |
          $lock = Get-Content vendor/grok-build.lock | Where-Object { $_ -match '^(repo|commit)=' }
          $repo = ($lock | Where-Object { $_ -like 'repo=*' }) -replace '^repo=', ''
          $commit = ($lock | Where-Object { $_ -like 'commit=*' }) -replace '^commit=', ''
          $engine = Join-Path (Split-Path $PWD -Parent) "grok-build"
          git clone -c core.longpaths=true $repo $engine
          git -C $engine checkout $commit
          git -C $engine apply (Join-Path $PWD "vendor/grok-build-local.patch")
          Copy-Item vendor/grok-build-Cargo.lock (Join-Path $engine "Cargo.lock") -Force
      - name: 占位 dist（tauri generate_context! 编译期要求 frontendDist 存在）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content dist/index.html "<!doctype html><title>ci stub</title>"
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "../grok-build -> target"
      - name: clippy
        working-directory: src-tauri
        # --no-deps：-D warnings 只对 wancode 自身生效。引擎是固定 commit 的
        # 上游代码，自带若干 clippy 警告，不该由我们的 CI 拦截。
        run: cargo clippy --locked -p wancode --lib --no-deps -- -D warnings
      # Gate 1：证明"选中某模型"的请求确实落在该模型自己的端点上、带自己的
      # Key。断言是请求计数（正确端点 1 次、错误端点 0 次）与 Authorization
      # 头，不是对代码路径的推理。跑在引擎目录，与克隆步同一套路径推导。
      - name: Gate 1 引擎侧路由证据（双 mock 端点）
        shell: pwsh
        run: |
          $engine = Join-Path (Split-Path $PWD -Parent) "grok-build"
          Set-Location $engine
          cargo test --locked -p xai-grok-shell --test model_endpoint_routing
      # #127-4 D3 落点：上下文压缩由引擎 crate 单测覆盖（合规矩阵引用此步）。
      - name: 引擎压缩单测（xai-grok-compaction）
        shell: pwsh
        run: |
          $engine = Join-Path (Split-Path $PWD -Parent) "grok-build"
          Set-Location $engine
          cargo test --locked -p xai-grok-compaction
      # 磁盘上的旧会话记录 → 歧义 → 用户选定 → 真实 HTTP。不含 GUI 那一段。
      - name: 引擎身份链集成测试（旧记录 → 歧义 → 选定 → 正确端点）
        shell: pwsh
        run: |
          $engine = Join-Path (Split-Path $PWD -Parent) "grok-build"
          Set-Location $engine
          cargo test --locked -p xai-grok-shell --test model_identity_e2e
      - name: lib 单测 + 引擎金丝雀
        working-directory: src-tauri
        env:
          COMPLIANCE_SUMMARY_PATH: ${{ github.workspace }}/compliance-summary-4a.json
          COMPLIANCE_SUMMARY_PATH_4B: ${{ github.workspace }}/compliance-summary-4b.json
        run: cargo test --locked -p wancode --lib --test engine_canary --test model_block_over_acp --test job_breakaway --test provider_compliance --test provider_compliance_4b
      # #127-4 摘要真实导出：PR 5 从此 artifact 消费，不靠被 cargo 捕获的 stdout。
      - name: 上传合规摘要 artifact
        uses: actions/upload-artifact@v4
        with:
          name: compliance-summary-4a
          path: compliance-summary-4a.json
          if-no-files-found: error
      # 锁文件漂移修复（#126 B1 复核发现）：--locked 只保证 cargo 不改写，
      # 这里再以字节断言"整个构建期间 Cargo.lock 冻结"——覆盖文件与引擎树
      # 内文件在全部 build/test 之后仍逐字节相等。
      - name: 构建后 Cargo.lock 冻结断言
        shell: pwsh
        run: |
          $engine = Join-Path (Split-Path $PWD -Parent) "grok-build"
          $a = (Get-FileHash vendor/grok-build-Cargo.lock -Algorithm SHA256).Hash
          $b = (Get-FileHash (Join-Path $engine "Cargo.lock") -Algorithm SHA256).Hash
          if ($a -ne $b) {
            Write-Host "::error::构建后 Cargo.lock 被改写：vendor=$a engine=$b（有效树在构建期间未保持冻结）"
            exit 1
          }
          Write-Host "Cargo.lock 冻结断言 OK：$a"
      # #127-5：校验已提交的证据文件（哈希/pass/ci_sha/字段齐备），
      # 不下载即将过期的 artifact。
      - name: 校验合规证据文件
        shell: pwsh
        run: python scripts/verify_compliance_evidence.py
      - name: 上传合规摘要 artifact（4b）
        uses: actions/upload-artifact@v4
        with:
          name: compliance-summary-4b
          path: compliance-summary-4b.json
          if-no-files-found: error
