# W1 解析可行性 spike —— 独立于引擎 workspace,秒级构建,只产证据不进产品。
# 评估:PDF/DOCX 解析器在【安全面】(不受信输入)的行为,对照设计稿
# docs/design/v0.20-work-cowork-increment.md §1.1 的双门清单。
[package]
name = "w1-parser-spike"
version = "0.0.0"
edition = "2021"
publish = false

# 探索性 API 可行性 spike(非安全门关闭证据)。lopdf/docx-rs 做 PDF/DOCX,
# zip 仅 deflate 特性。精确声明(codex R2-F1):压缩栈为纯 Rust deflate,
# 无单独分发的原生二进制;不宣称整依赖图零原生。
[dependencies]
lopdf = "0.34"
docx-rs = "0.4"
# zip 默认特性会拉进 bzip2-sys/lzma-sys/zstd-sys 原生链(codex R1-F4)。
# 仅启用 `deflate`(miniz_oxide 纯 Rust 后端)。构建后核验 lockfile 无 *-sys。
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"

[[bin]]
name = "w1_probe"
path = "src/main.rs"

# 独立 workspace,不被 ../grok-build 吸入
[workspace]
