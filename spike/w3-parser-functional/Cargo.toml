[package]
name = "w3-parser-functional"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# 与 W1 同款纯 Rust 栈：zip 只开 deflate（miniz_oxide），不拉 *-sys 原生链。
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
# 与 W1 同款纯 Rust PDF 栈。
lopdf = "0.34"
serde_json = "1"
# 选项 2 候选（并列评测，同一轮定生死）：
# pdf-extract 自带 Type0/CID + ToUnicode 解码；pdf 为另一纯 Rust 实现。
pdf-extract = "0.9"
pdf = "0.9"

[[bin]]
name = "w3_docx_probe"
path = "src/main.rs"

[[bin]]
name = "w3_pdf_probe"
path = "src/pdf.rs"

[[bin]]
name = "w3_diag"
path = "src/diag.rs"

[[bin]]
name = "w3_diag2"
path = "src/diag2.rs"

[[bin]]
name = "w3_opt2"
path = "src/opt2.rs"

# 独立 workspace，不被 ../grok-build 吸入（与 W1 spike 同）
[workspace]
