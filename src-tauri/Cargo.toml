[package]
name = "wancode"
version = "0.23.2"
description = "WanCode - multi-model desktop AI coding agent"
authors = ["WanCode"]
edition = "2021"
# This crate is a member of the grok-build workspace (see ../../grok-build/Cargo.toml)
# so it can consume grok-build crates that use `workspace = true` dependency inheritance.
workspace = "../../grok-build"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wancode_lib"
# WanCode currently ships Windows desktop builds only.  The executable links
# this library as an rlib; emitting mobile-oriented staticlib/cdylib variants
# on Windows makes Cargo's normal library and libtest harness race for the same
# .dll/.lib outputs and can make otherwise-correct full test runs flaky.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# 仅供 #129 更新验收：0.18.7-test 隔离构建用它把更新源指向 prerelease 的
# latest-test.json。正式构建绝不启用——生产包不含任何更新地址覆盖能力
# （编译期开关，非环境变量，无法在用户机器上被打开）。
updater-test-endpoint = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
toml_edit = "0.22"
toml = { version = "0.9", features = ["preserve_order"] }
url = "2"
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
# ── W3 解析栈（一次性加齐，见裁断：NFC + DOCX crate + PDF 栈同一轮）──
# NFC：设计 §1.2 要求摘录相等性判定为 NFC + 空白折叠。补上它会改变相等性
# 语义，故同批 bump CURRENT_ANCHOR_SCHEMA。
unicode-normalization = "0.1"
# DOCX：zip 只开 deflate（miniz_oxide 纯 Rust），避开 bzip2/lzma/zstd 的
# *-sys 原生链（W1 spike 结论）。构建后核验 lock 无新增 *-sys。
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# PDF：pdfium-render 是绑定，PDFium 本体按 vendor/pdfium.lock 在构建期取回
# 并校验（来源政策 2，见 scripts/fetch_pdfium.ps1）。运行期动态绑定，
# 不静态链接。
pdfium-render = "0.9"
tempfile = "3"
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
anyhow = { workspace = true }
# 与引擎同版同特性——用于 #83：git 命令显式解析 gitRoot，绕开引擎的
# workspace-root 回退（会把「不是仓库」静默替换成宿主仓库的状态）。
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
xai-acp-lib = { path = "../../grok-build/crates/codegen/xai-acp-lib" }
xai-grok-paths = { path = "../../grok-build/crates/codegen/xai-grok-paths" }
xai-grok-pager = { path = "../../grok-build/crates/codegen/xai-grok-pager" }
xai-grok-shell = { path = "../../grok-build/crates/codegen/xai-grok-shell" }
xai-grok-tools = { path = "../../grok-build/crates/codegen/xai-grok-tools" }
xai-grok-sampling-types = { path = "../../grok-build/crates/codegen/xai-grok-sampling-types" }

[target.'cfg(windows)'.dependencies]
# v0.17-3 Job Object：进程树治理（kill-on-close），版本对齐依赖树已有的 0.59
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# tests/model_block_over_acp.rs：用隔离的 $GROK_HOME 起真实引擎，验证
# load_session 会经 ACP meta 交回 x.ai/modelBlock。
tempfile = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
# #127-4 Provider 合规套件：情景化 mock provider（对齐引擎测试的 axum 版本）
axum = { version = "0.8", features = ["macros"] }
futures-util = "0.3"

# #129：Job/breakaway 集成测试需要自我重入 helper 模式，标准 harness 无法
# 承载（helper 分支必须在 main 里分流），故关 harness 自写 main。
[[test]]
name = "job_breakaway"
harness = false

# W2.5 Work 引擎探针：harness = false。理由见测试文件头——GROK_HOME 的
# OnceLock 需独立进程才能真正隔离，且 panic=abort 与 libtest harness 冲突。
[[test]]
name = "work_surface_engine"
harness = false

# W3-P2 崩溃遏制：worker 是自我重入的（父起 current_exe()），worker 分支
# 必须在 main 里最先分流，标准 harness 承载不了——与 job_breakaway 同因。
[[test]]
name = "work_parse_containment"
harness = false
